name: Publish Bingie Kodi repository
on:
  push:
    branches: [omega]
    paths-ignore:
      - 'repo/**'
  workflow_dispatch:
  schedule:
    # Refresh extension forks twice daily; Kodi receives new versions automatically.
    - cron: '17 5,17 * * *'
permissions:
  contents: write
concurrency:
  group: bingie-build-omega
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout skin source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Use latest omega revision
        run: |
          git fetch origin omega
          git checkout omega
          git reset --hard origin/omega
      - name: Fetch our editable Bingie Toolbox
        uses: actions/checkout@v4
        with:
          repository: ntls2000/script.bingie.toolbox
          ref: main
          path: addons-src/script.bingie.toolbox
          persist-credentials: false
      - name: Fetch our editable Bingie Widgets
        uses: actions/checkout@v4
        with:
          repository: ntls2000/script.bingie.widgets
          ref: main
          path: addons-src/script.bingie.widgets
          persist-credentials: false
      - name: Fetch our editable Bingie Common Module
        uses: actions/checkout@v4
        with:
          repository: ntls2000/script.module.bingie
          ref: main
          path: addons-src/script.module.bingie
          persist-credentials: false
      - name: Fetch Kodi 22 Skin Shortcuts v3 beta
        uses: actions/checkout@v4
        with:
          repository: ntls2000/skin.bingie
          ref: kodi22-skinshortcuts-v3
          path: beta-skin-source
          persist-credentials: false
      - name: Verify source and Kodi 22 Python syntax
        run: |
          python3 tools/check_kodi22.py
          python3 - <<'PY'
          import ast
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for root in sorted(Path('addons-src').iterdir()):
              manifest = ET.parse(root / 'addon.xml').getroot()
              assert manifest.get('id') == root.name
              for file in root.rglob('*.py'):
                  ast.parse(file.read_text(encoding='utf-8-sig'), filename=str(file))
              print(f"OK: {root.name} v{manifest.get('version')} Python and manifest")
          PY
      - name: Generate Kodi repository
        run: python3 tools/build_kodi_repo.py
      - name: Publish the validated v3 beta in our existing Kodi repository
        run: |
          python3 - <<'PY'
          import hashlib
          import shutil
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from zipfile import ZipFile

          beta = Path('beta-skin-source')
          expected = '2.0.4~beta2'
          manifest = ET.parse(beta / 'addon.xml').getroot()
          assert manifest.get('id') == 'skin.bingie'
          assert manifest.get('version') == expected, 'Unexpected beta version'
          deps = {x.get('addon'): x.get('version') for x in manifest.findall('./requires/import')}
          assert deps.get('script.skinshortcuts') == '3.0.4', 'Skin Shortcuts v3 is required'

          source = beta / 'repo/skin.bingie' / f'skin.bingie-{expected}.zip'
          assert source.is_file(), 'Compiled beta ZIP missing from test branch'
          with ZipFile(source) as archive:
              bundled = ET.fromstring(archive.read('skin.bingie/addon.xml'))
              assert bundled.get('id') == 'skin.bingie'
              assert bundled.get('version') == expected, 'Beta ZIP version does not match manifest'

          destination = Path('repo/skin.bingie') / source.name
          destination.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(source, destination)

          index = Path('repo/addons.xml')
          catalog = ET.parse(index).getroot()
          old = [a for a in catalog.findall('addon') if a.get('id') == 'skin.bingie']
          assert len(old) == 1, 'Skin catalogue entry not unique'
          catalog.remove(old[0])
          catalog.insert(0, manifest)
          ET.indent(catalog, space='    ')
          xml = ET.tostring(catalog, encoding='utf-8', xml_declaration=True) + b'\n'
          index.write_bytes(xml)
          Path('repo/addons.xml.md5').write_text(hashlib.md5(xml).hexdigest(), encoding='ascii')
          print(f'Published Bingie {expected} (Skin Shortcuts 3) to existing Kodi repository')
          PY
      - name: Publish ZIP files and repository index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo/
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish Kodi repository packages [skip ci]"
            git push origin HEAD:omega
          fi
