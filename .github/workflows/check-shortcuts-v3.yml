name: Validate Bingie Skin Shortcuts v3 beta
on:
  push:
    branches: [kodi22-skinshortcuts-v3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python tools/check_kodi22.py
      - run: python tools/check_shortcuts_v3.py
