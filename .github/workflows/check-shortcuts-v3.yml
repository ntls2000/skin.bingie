name: Validate Bingie Skin Shortcuts v3 and Modern UI
on:
  push:
    branches: [kodi22-skinshortcuts-v3]
    paths-ignore:
      - 'repo/**'
  workflow_dispatch:
concurrency:
  group: bingie-v3-beta
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  static-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python tools/check_kodi22.py
      - run: python tools/check_shortcuts_v3.py
      - name: Build separate test ZIP (never published to omega)
        run: python tools/build_kodi_repo.py
      - name: Preserve test ZIP for manual Kodi 22 verification
        uses: actions/upload-artifact@v4
        with:
          name: bingie-2.0.5-beta1-modern-2026-test
          path: repo/skin.bingie/skin.bingie-2.0.5~beta1.zip
          if-no-files-found: error
          retention-days: 14
      - name: Publish the beta ZIP on this test branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f 'repo/skin.bingie/skin.bingie-2.0.5~beta1.zip'
          if ! git diff --cached --quiet; then
            git commit -m "test: publish Kodi 22 Skin Shortcuts v3 beta ZIP [skip ci]"
            git push origin HEAD:kodi22-skinshortcuts-v3
          fi
