name: Validate Bingie Skin Shortcuts v3 beta
on:
  push:
    branches: [kodi22-skinshortcuts-v3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python tools/check_kodi22.py
      - run: python tools/check_shortcuts_v3.py
      - name: Build separate test ZIP (never published to omega)
        run: python tools/build_kodi_repo.py
      - name: Preserve test ZIP for manual Kodi 22 verification
        uses: actions/upload-artifact@v4
        with:
          name: bingie-2.0.4-beta1-skinshortcuts-v3-test
          path: repo/skin.bingie/skin.bingie-2.0.4~beta1.zip
          if-no-files-found: error
          retention-days: 14
